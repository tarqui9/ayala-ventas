# Entorno de desarrollo: el código se monta desde tus carpetas,
# así que los cambios que hagas se ven al instante.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nventas
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "3307:3306"   # 3307 para no chocar con el MySQL de tu máquina
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro   # .sql que se importan la primera vez
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 20

  ml:
    build: ./ml
    ports:
      - "8001:8001"
    volumes:
      - ./ml/artifacts:/app/artifacts   # el modelo entrenado se conserva
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 10

  backend:
    build: ./laravel_nventas-main
    ports:
      - "8000:8000"
    volumes:
      - ./laravel_nventas-main:/var/www
      - vendor:/var/www/vendor
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nventas
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      PREDICTIVO_URL: http://ml:8001
    command: sh -c "composer install --no-interaction && cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_healthy

  frontend:
    build: "./app ang ventas"
    ports:
      - "4200:4200"
    volumes:
      - "./app ang ventas:/app"
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0 --port 4200 --poll 2000"
    depends_on:
      - backend

  phpmyadmin:          # ver la base desde el navegador: http://127.0.0.1:8080
    image: phpmyadmin:5
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  vendor:
  node_modules:
